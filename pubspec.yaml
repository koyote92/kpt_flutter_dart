name: webview_app
description: "Кураж Продаж Тренажёр"
version: 1.0.6+7

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  onesignal_flutter: ^5.6.1
  url_launcher: ^6.3.0
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.13.1
  flutter_launcher_icons: ^0.14.4
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/web/
    - assets/web/bootstrap/css/
    - assets/web/bootstrap/js/
    - assets/web/img/
    - assets/web/icons/
    - assets/web/webfonts/

flutter_launcher_icons:
  android: false
  ios: true
  image_path: "good_icon.jpg"